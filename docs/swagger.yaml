basePath: /
definitions:
  models.AIMentorChunk:
    properties:
      token:
        type: string
    type: object
  models.AIMentorRequest:
    properties:
      career_id:
        type: integer
      message:
        type: string
    type: object
  models.BookmarkRequest:
    properties:
      career_id:
        type: integer
    type: object
  models.CreateChallengeRequest:
    properties:
      career_id:
        type: integer
    type: object
  models.CreateProjectIdeaRequest:
    properties:
      description:
        type: string
      title:
        type: string
    type: object
  models.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  models.RefreshRequest:
    properties:
      refresh_token:
        type: string
    type: object
  models.RegisterRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    type: object
  models.SubmitSurveyRequest:
    type: object
  models.UpdateProfileRequest:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      name:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Career discovery API for Nepal
  title: Carevo API
  version: "1.0"
paths:
  /ai/careers/{id}/score:
    get:
      parameters:
      - description: Career ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get compatibility score for a specific career
      tags:
      - ai
  /ai/chat:
    post:
      consumes:
      - application/json
      parameters:
      - description: Career ID and message
        in: body
        name: body
        required: true
        schema:
