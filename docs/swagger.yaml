      produces:
      - text/event-stream
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AIMentorChunk'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Chat with AI mentor (SSE stream)
      tags:
      - ai
  /ai/results/me:
    get:
